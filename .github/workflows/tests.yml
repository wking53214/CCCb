name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (non-editable, so packaged data is what gets tested)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff==0.15.22
          python -m pip install .
      - name: Test against the installed package
        run: |
          mkdir -p /tmp/run && cp -r tests /tmp/run/
          cd /tmp/run && python -m pytest -q tests
      - name: Lint (hard gate)
        run: ruff check .
