name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (non-editable, so packaged data is what gets tested)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff==0.15.22
          python -m pip install .
      - name: Test against the installed package
        run: |
          mkdir -p /tmp/run && cp -r tests pyproject.toml /tmp/run/
          cd /tmp/run && python -m pytest -q tests
      - name: Lint (hard gate)
        run: ruff check .

  cns:
    # The optional CNS connector (cccb.cns_connector), with the extra installed. CCCB_REQUIRE_CNS=1 turns a
    # missing cns into a failure, so these tests cannot silently skip here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the cns extra (non-editable, so the installed copy is what gets tested)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install ".[cns]"
      - name: Test against the installed package with CNS present
        env:
          CCCB_REQUIRE_CNS: "1"
        run: |
          mkdir -p /tmp/run && cp -r tests pyproject.toml /tmp/run/
          cd /tmp/run && python -m pytest -q -rs tests
